services:
  wetty:
    build: .
    container_name: wetty
    ports:
      - "8080:8080"
    environment:
      # The machine wetty connects to on load - edit these for your target.
      SSH_HOST: your-host-or-ip
      SSH_PORT: "22"
      SSH_USER: your-user
    volumes:
      # Persists known_hosts (and lets you drop in a private key + ssh
      # config) across container restarts, so you're not re-accepting the
      # host key or retyping a passphrase from scratch every time. Mount a
      # real key here (e.g. - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro) for
      # passwordless login; otherwise ssh will prompt for a password in the
      # terminal itself on first connect.
      - wetty-ssh:/root/.ssh
    restart: unless-stopped

volumes:
  wetty-ssh:

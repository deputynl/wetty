set -g mouse on
set -g history-limit 50000
set -g renumber-windows on
set -g status off

# Right-click pane menu, trimmed to the handful of actions that make sense
# here - tmux's stock menu also offers things like break-pane/swap-pane
# that don't map to anything in this app. `{mouse}` targets whichever pane
# was actually clicked, same as tmux's own default binding uses - not just
# "the active pane" - so this stays correct with multiple panes open.
#
# No menu-style/menu-border-style/etc here: those options don't exist
# before tmux 3.4, and the image's tmux (whatever Debian bookworm's apt
# ships - 3.3a as of this writing) is one version behind that, so setting
# them just prints "invalid option" into every pane on startup instead of
# doing anything. The menu renders in tmux's default colors instead.
unbind-key -n MouseDown3Pane
bind-key -n MouseDown3Pane display-menu -t '{mouse}' -x M -y M \
  "Split Right" h "split-window -h -t '{mouse}'" \
  "Split Down"  v "split-window -v -t '{mouse}'" \
  "Zoom Pane"   z "resize-pane -Z -t '{mouse}'" \
  "" \
  "Close Pane"  x "kill-pane -t '{mouse}'"

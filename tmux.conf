set -g mouse on
set -g history-limit 50000
set -g renumber-windows on
set -g status off

# Right-click pane menu, restyled to roughly match the web UI's dark
# palette and trimmed to the handful of actions that make sense here -
# tmux's stock menu also offers things like break-pane/swap-pane that don't
# map to anything in this app. `{mouse}` targets whichever pane was
# actually clicked, same as tmux's own default binding uses - not just
# "the active pane" - so this stays correct with multiple panes open.
set -g menu-style "bg=#262624,fg=#f2f0e9"
set -g menu-selected-style "bg=#3e3d38,fg=#f2f0e9"
set -g menu-border-style "fg=#3e3d38"
set -g menu-border-lines rounded

unbind-key -n MouseDown3Pane
bind-key -n MouseDown3Pane display-menu -t '{mouse}' -x M -y M \
  "Split Right" h "split-window -h -t '{mouse}'" \
  "Split Down"  v "split-window -v -t '{mouse}'" \
  "Zoom Pane"   z "resize-pane -Z -t '{mouse}'" \
  "" \
  "Close Pane"  x "kill-pane -t '{mouse}'"
